[package]
name = "sagebrush-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "sagebrush_node"
crate-type = ["cdylib"]

[dependencies]
sagebrush-modsym = { path = "../modsym" }
rayon = "1.10"
num-bigint = "0.4"
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
